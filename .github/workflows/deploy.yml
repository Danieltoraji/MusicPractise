# 单通道自动部署（docs/31 §3.3）：push 到 main（或手动触发）→ 测试 → 构建 →
# D1 远端迁移 → 发布 Cloudflare Workers（https://musicpractise.danieltoraji.workers.dev/）。
#
# 前置（一次性）：
# · 仓库 Settings → Secrets and variables → Actions：
#     CLOUDFLARE_API_TOKEN  （Cloudflare 面板 → My Profile → API Tokens 自建，
#                            权限 Account → Workers Scripts: Edit + Account → D1: Edit）
#     CLOUDFLARE_ACCOUNT_ID （Cloudflare 面板 → Workers & Pages 概览右侧）
# · D1 数据库 musicpractise-db 需已创建（面板 Storage & Databases → D1，
#   database_id 已写入 wrangler.jsonc）。

name: Deploy（Cloudflare Workers）

on:
  push:
    branches: [main]
  workflow_dispatch:

# 并发组保证旧的部署在途时新推送只会部署最后一次
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    name: 测试（vitest 全量）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试（vitest 全量）
        run: npm test

  deploy:
    name: 发布 Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # Workers 根路径 base（单通道后无差异化构建）
      - name: 构建
        run: npm run build

      - name: 应用 D1 迁移（远端）
        uses: cloudflare/wrangler-action@v3
        with:
          # 锁定 wrangler 版本，避免 latest 大版本变动导致 CI 突然失败
          wranglerVersion: 4.147.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply musicpractise-db --remote

      - name: 发布到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: 4.147.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
